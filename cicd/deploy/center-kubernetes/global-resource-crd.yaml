apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: edgionglobalresources.center.edgion.io
spec:
  group: center.edgion.io
  names:
    kind: EdgionGlobalResource
    plural: edgionglobalresources
    shortNames: [egr]
    singular: edgionglobalresource
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required:
                - contractVersion
                - globalResourceId
                - generation
                - desiredRevision
                - resourceJson
              x-kubernetes-validations:
                - rule: self == oldSelf || self.generation == oldSelf.generation + 1
              properties:
                contractVersion:
                  type: integer
                  format: int32
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                globalResourceId:
                  type: string
                  maxLength: 253
                  x-kubernetes-validations:
                    - rule: self != ''
                    - rule: self == oldSelf
                generation:
                  type: integer
                  format: int64
                  minimum: 1.0
                  x-kubernetes-validations:
                    - rule: self > 0
                desiredRevision:
                  type: string
                  minLength: 71
                  maxLength: 71
                  x-kubernetes-validations:
                    - rule: self.matches('^sha256:[0-9a-f]{64}$')
                resourceJson:
                  type: string
                  minLength: 1
                  maxLength: 1048576
